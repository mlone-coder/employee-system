<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EMPLOYEE-SYSTEM PRO</title>
    <style>
        :root {
            --bg: #ffffff; --text: #000000; --card: #f4f4f4; --border: #e5e5e5;
            --radius: 14px; --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        [data-theme="dark"] { --bg: #000000; --text: #ffffff; --card: #1a1a1a; --border: #333333; }
        
        /* --- 禁止全页面选字 --- */
        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            font-family: -apple-system, sans-serif; 
            -webkit-tap-highlight-color: transparent;
            user-select: none; -webkit-user-select: none; /* 禁止选字 */
        }
        /* 允许输入框选字和操作 */
        input, textarea { user-select: auto !important; -webkit-user-select: auto !important; }
        
        body { background: var(--bg); color: var(--text); padding-bottom: 120px; overflow-x: hidden; transition: 0.3s; }
        
        /* --- 自定义高级弹窗 --- */
        .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 10000; }
        .modal-box { background: var(--bg); width: 88%; max-width: 350px; padding: 25px; border-radius: 20px; border: 1px solid var(--border); text-align: center; animation: modalPop 0.3s var(--transition); }
        @keyframes modalPop { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-btn-row { display: flex; gap: 10px; margin-top: 20px; }
        .m-btn { flex: 1; padding: 14px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; font-size: 13px; }
        .m-btn-black { background: var(--text); color: var(--bg); }
        .m-btn-gray { background: var(--card); color: var(--text); }
        
        /* --- 顶部区域 --- */
        .header { padding: 30px 25px 15px; display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid var(--border); }
        .time-display { font-size: 34px; font-weight: 900; line-height: 1; letter-spacing: -1.5px; white-space: nowrap; }
        .date-display { font-size: 11px; font-weight: 800; opacity: 0.4; margin-top: 6px; }
        .table-card { background: var(--text); color: var(--bg); padding: 8px 15px; border-radius: 10px; text-align: center; min-width: 70px; }
        .table-input { background: transparent; border: none; color: inherit; font-size: 20px; font-weight: bold; width: 35px; text-align: center; outline: none; }
        
        /* --- 搜索栏 --- */
        .search-area { padding: 10px 25px; }
        .search-box { background: var(--card); padding: 12px 18px; border-radius: 16px; display: flex; align-items: center; gap: 12px; }
        .search-svg { width: 16px; height: 16px; stroke: var(--text); stroke-width: 2.5; fill: none; opacity: 0.3; }
        .search-box input { background: transparent; border: none; width: 100%; outline: none; font-size: 14px; color: var(--text); font-weight: 600; }
        
        /* --- 3列菜单 --- */
        .page { display: none; padding: 0 25px; animation: fadeIn 0.4s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .menu-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
        .drink-card { background: var(--card); border-radius: 12px; padding: 10px 5px; text-align: center; overflow: hidden; position: relative; }
        .drink-img { width: 100%; aspect-ratio: 1; background: #ddd; border-radius: 8px; margin-bottom: 6px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .drink-img img { width: 100%; height: 100%; object-fit: cover; position: absolute; }
        .drink-card b { font-size: 11px; font-weight: 800; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        /* --- 侧滑历史列表 --- */
        .swipe-container { position: relative; overflow: hidden; border-radius: 12px; margin-bottom: 8px; background: #ff3b30; }
        .swipe-body { background: var(--card); padding: 15px 18px; display: flex; justify-content: space-between; align-items: center; transition: transform 0.3s ease; position: relative; z-index: 2; min-height: 70px; }
        .swipe-btn { position: absolute; right: 0; top: 0; width: 80px; height: 100%; display: flex; align-items: center; justify-content: center; color: white; font-size: 12px; font-weight: bold; z-index: 1; cursor: pointer; }
        .swipe-info { flex: 1; padding-right: 10px; word-break: break-word; line-height: 1.3; }
        
        /* --- 底部导航栏 --- */
        .nav-dock { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 420px; height: 75px; background: var(--bg); border: 2px solid var(--text); border-radius: 25px; display: flex; align-items: center; z-index: 1000; padding: 0 8px; }
        .nav-item { flex: 1; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2; color: #aaa; position: relative; transition: color 0.3s; }
        .nav-item.active { color: var(--bg); }
        .nav-item svg { width: 20px; height: 20px; fill: currentColor; margin-bottom: 4px; }
        .nav-item span { font-size: 9px; font-weight: 800; }
        .nav-indicator { position: absolute; top: 8px; left: 8px; width: calc(33.33% - 5.3px); height: 55px; background: var(--text); border-radius: 18px; transition: var(--transition); z-index: 1; }
        .badge { position: absolute; top: 12px; right: 18%; background: red; color: white; padding: 2px 6px; border-radius: 8px; font-size: 9px; font-weight: bold; min-width: 18px; text-align: center; border: 2px solid var(--bg); }
        
        /* --- 管理列表 (箭头推至最右) --- */
        .admin-entry { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; background: var(--card); border-radius: 15px; margin-top: 30px; cursor: pointer; }
        .admin-item { display: flex; align-items: center; padding: 15px; background: var(--card); border-radius: 12px; margin-bottom: 10px; }
        .admin-logo { width: 35px; height: 35px; background: #fff; border: 1px solid var(--border); border-radius: 8px; margin-right: 12px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .admin-logo img { width: 100%; height: 100%; object-fit: cover; }
        .admin-name { flex: 1; font-weight: 700; font-size: 14px; }
        .admin-arrow-large { font-size: 26px; font-weight: 200; opacity: 0.3; margin-left: auto; line-height: 1; }
        
        /* --- 切换开关 --- */
        .switcher { background: var(--card); padding: 5px; border-radius: 12px; display: flex; position: relative; height: 44px; margin-bottom: 20px; }
        .sw-btn { flex: 1; z-index: 2; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; color: #888; transition: color 0.3s; }
        .sw-btn.active { color: var(--bg); }
        .sw-slider { position: absolute; top: 5px; left: 5px; height: 34px; background: var(--text); border-radius: 8px; transition: var(--transition); z-index: 1; }
        
        #managePage { position: fixed; top: 0; left: 100%; width: 100%; height: 100%; background: var(--bg); z-index: 2000; transition: var(--transition); padding: 40px 25px; overflow-y: auto; }
        #managePage.show { left: 0; }
        .back-svg { width: 30px; height: 30px; stroke: var(--text); stroke-width: 2.5; fill: none; margin-bottom: 25px; cursor: pointer; }
        .empty-hint { text-align: center; padding: 40px 0; color: #999; font-size: 14px; font-style: italic; opacity: 0.7; }
    </style>
</head>

<body data-theme="light">

    <div id="modalOverlay" class="modal-overlay">
        <div class="modal-box">
            <p id="modalMsg" style="font-weight:700; line-height:1.5;"></p>
            <div class="modal-btn-row" id="modalBtns"></div>
        </div>
    </div>

    <!-- 口味弹窗 -->
    <div id="optionModal" class="modal-overlay">
        <div class="modal-box">
            <h3 id="optDrinkName" style="font-weight:900;">-</h3>
            <div style="margin-top:15px; text-align:left;">
                <p style="font-size:9px; font-weight:800; color:#999; margin-bottom:6px;" data-i18n="taste">浓度 TASTE</p>
                <div class="switcher" id="tasteSwitch" style="height:38px;">
                    <div class="sw-slider" style="width:calc(33.33% - 4px);"></div>
                    <div class="sw-btn active" onclick="setOpt(this, 0)">正常</div>
                    <div class="sw-btn" onclick="setOpt(this, 1)">厚(Gau)</div>
                    <div class="sw-btn" onclick="setOpt(this, 2)">薄(Po)</div>
                </div>
                <p style="font-size:9px; font-weight:800; color:#999; margin-bottom:6px;" data-i18n="sugar">糖分 SUGAR</p>
                <div class="switcher" id="sugarSwitch" style="height:38px;">
                    <div class="sw-slider" style="width:calc(33.33% - 4px);"></div>
                    <div class="sw-btn active" onclick="setOpt(this, 0)">正常</div>
                    <div class="sw-btn" onclick="setOpt(this, 1)">少糖</div>
                    <div class="sw-btn" onclick="setOpt(this, 2)">无糖</div>
                </div>
                <p style="font-size:9px; font-weight:800; color:#999; margin-bottom:6px;" data-i18n="size">分量 SIZE</p>
                <div class="switcher" id="sizeSwitch" style="height:38px;">
                    <div class="sw-slider" style="width:calc(33.33% - 4px);"></div>
                    <div class="sw-btn active" onclick="setOpt(this, 0)">正常</div>
                    <div class="sw-btn" onclick="setOpt(this, 1)">大杯</div>
                    <div class="sw-btn" onclick="setOpt(this, 2)">最小杯</div>
                </div>
                <input type="text" id="customRem" style="width:100%; padding:12px; background:var(--card); border:none; border-radius:10px; font-size:12px; color:var(--text); font-weight:600;" data-i18n-ph="remark_ph" placeholder="备注 (如:走冰)...">
            </div>
            <div class="modal-btn-row">
                <button class="m-btn m-btn-gray" onclick="closeOpt()" data-i18n="cancel">取消</button>
                <button class="m-btn m-btn-black" onclick="confirmAdd()" data-i18n="confirm">确定</button>
            </div>
        </div>
    </div>

    <!-- 顶部 -->
    <div class="header">
        <div>
            <h1 style="font-size:11px; letter-spacing:1px; font-weight:900; opacity:0.5; margin-bottom:3px;">EMPLOYEE-SYSTEM</h1>
            <div class="time-display" id="liveClock">00:00 --</div>
            <div class="date-display" id="liveDate">2024/01/01</div>
        </div>
        <div class="table-card">
            <small data-i18n="table">桌号 TABLE</small>
            <input type="number" id="tableNum" class="table-input" placeholder="01">
        </div>
    </div>

    <!-- 搜索 -->
    <div class="search-area" id="searchArea">
        <div class="search-box">
            <svg class="search-svg" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="7" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input type="text" id="searchInp" oninput="window.filterMenu()" data-i18n-ph="search_ph" placeholder="搜索饮品...">
        </div>
    </div>

    <!-- 首页 -->
    <div id="homePage" class="page active">
        <div class="menu-grid" id="menuGrid"></div>
    </div>

    <!-- 购物车 -->
    <div id="cartPage" class="page">
        <h3 style="font-size:11px; letter-spacing:1px; margin: 15px 0;" data-i18n="nav_cart">购物车 CART</h3>
        <div id="draftList"></div>
        <div id="cartSummary" style="display:none; margin-top:20px; background:var(--text); color:var(--bg); padding:20px; border-radius:15px; display:flex; justify-content:space-between; align-items:center;">
            <div>
                <p style="font-size:9px; opacity:0.6;" data-i18n="total">总计</p>
                <div id="totalPriceDisplay" style="font-size:22px; font-weight:900;">RM 0.00</div>
            </div>
            <button onclick="submitOrder()" style="background:var(--bg); color:var(--text); border:none; padding:12px 18px; border-radius:10px; font-weight:900; font-size:12px;" data-i18n="send">发送订单</button>
        </div>
        <h3 style="font-size:11px; letter-spacing:1px; margin: 40px 0 15px;" data-i18n="history">历史记录 HISTORY</h3>
        <div id="historyList"></div>
    </div>

    <!-- 设置 -->
    <div id="settingsPage" class="page">
        <h3 style="font-size:11px; opacity:0.6;" data-i18n="theme_set">主题模式 THEME</h3>
        <div class="switcher" id="themeSwitch">
            <div id="themeSlider" class="sw-slider" style="width: calc(33.33% - 4px);"></div>
            <div class="sw-btn active" onclick="setTheme('auto', 0)">AUTO</div>
            <div class="sw-btn" onclick="setTheme('light', 1)">LIGHT</div>
            <div class="sw-btn" onclick="setTheme('dark', 2)">DARK</div>
        </div>

        <h3 style="font-size:11px; opacity:0.6;" data-i18n="lang_set">语言 LANGUAGE</h3>
        <div class="switcher" id="langSwitch">
            <div id="langSlider" class="sw-slider" style="width: calc(50% - 5px);"></div>
            <div class="sw-btn active" onclick="setLang('zh', 0)">中文</div>
            <div class="sw-btn" onclick="setLang('en', 1)">ENGLISH</div>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
            <div>
                <h3 style="font-size:10px; opacity:0.6;" data-i18n="time_fmt">时间格式</h3>
                <div class="switcher" id="timeSwitch">
                    <div id="timeSlider" class="sw-slider" style="width: calc(50% - 5px);"></div>
                    <div class="sw-btn active" onclick="setTimeFmt('12h', 0)">12H</div>
                    <div class="sw-btn" onclick="setTimeFmt('24h', 1)">24H</div>
                </div>
            </div>
            <div>
                <h3 style="font-size:10px; opacity:0.6;" data-i18n="date_fmt">日期格式</h3>
                <div class="switcher" id="dateSwitch">
                    <div id="dateSlider" class="sw-slider" style="width: calc(50% - 5px);"></div>
                    <div class="sw-btn active" onclick="setDateFmt('YMD', 0)">YMD</div>
                    <div class="sw-btn" onclick="setDateFmt('DMY', 1)">DMY</div>
                </div>
            </div>
        </div>

        <div class="admin-entry" onclick="toggleManage(true)">
            <div style="display:flex; align-items:center; gap:15px;">
                <div style="background:#fff; width:35px; height:35px; border-radius:10px; display:flex; align-items:center; justify-content:center; border:1px solid #eee;">🥤</div>
                <span data-i18n="manage" style="font-weight:700;">菜单库管理 (添加/删除)</span>
            </div>
            <div class="admin-arrow-large">></div>
        </div>
    </div>

    <!-- 管理页子层 -->
    <div id="managePage">
        <svg class="back-svg" viewBox="0 0 24 24" onclick="toggleManage(false)">
            <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
        <h2 style="font-size:24px; font-weight:900; margin-bottom:20px;" data-i18n="manage_title">管理云端菜单</h2>
        <div style="background:var(--card); padding:20px; border-radius:15px; margin-bottom:25px;">
            <input type="file" id="fileInp" accept="image/*" style="font-size:11px; margin-bottom:15px; width:100%;">
            <input type="text" id="addName" data-i18n-ph="name_ph" placeholder="名称" style="width:100%; padding:15px; border-radius:10px; border:1px solid #ddd; margin-bottom:10px; outline:none; color:var(--text); background:var(--bg);">
            <input type="number" id="addPrice" data-i18n-ph="price_ph" placeholder="价格" style="width:100%; padding:15px; border-radius:10px; border:1px solid #ddd; margin-bottom:15px; outline:none; color:var(--text); background:var(--bg);">
            <button onclick="addDrink()" style="width:100%; padding:18px; background:var(--text); color:var(--bg); border:none; border-radius:12px; font-weight:bold;" data-i18n="sync">同步到云端</button>
        </div>
        <div id="adminDrinkList"></div>
    </div>

    <!-- 导航 -->
    <div class="nav-dock">
        <div id="navIndicator" class="nav-indicator"></div>
        <div class="nav-item active" onclick="switchTab(0, 'homePage', this)"><svg viewBox="0 0 24 24">
                <path d="M10,20V14H14V20H19V12H22L12,3L2,12H5V20H10Z" />
            </svg><span data-i18n="nav_home">点餐</span></div>
        <div class="nav-item" onclick="switchTab(1, 'cartPage', this)">
            <div id="cartBadge" class="badge" style="display:none">0</div><svg viewBox="0 0 24 24">
                <path d="M17,18C15.89,18 15,18.89 15,20A2,2 0 0,0 17,22A2,2 0 0,0 19,20C19,18.89 18.1,18 17,18M1,2V4H3L6.6,11.59L5.24,14.04C5.09,14.32 5,14.65 5,15A2,2 0 0,0 7,17H19V15H7.42A0.25,0.25 0 0,1 7.17,14.75L7.2,14.63L8.1,13H15.55C16.3,13 16.96,12.58 17.3,11.97L20.88,5.5C21.05,5.19 21,4.82 20.88,4.5C20.76,4.18 20.4,4 20,4H5.21L4.27,2M7,18C5.89,18 5,18.89 5,20A2,2 0 0,0 7,22A2,2 0 0,0 9,20C9,18.89 8.1,18 7,18Z" />
            </svg><span data-i18n="nav_cart">购物车</span>
        </div>
        <div class="nav-item" onclick="switchTab(2, 'settingsPage', this)"><svg viewBox="0 0 24 24">
                <path d="M12,15.5A3.5,3.5 0 0,1 8.5,12A3.5,3.5 0 0,1 12,8.5A3.5,3.5 0 0,1 15.5,12A3.5,3.5 0 0,1 12,15.5M19.43,12.97C19.47,12.65 19.5,12.33 19.5,12C19.5,11.67 19.47,11.35 19.43,11.03L21.54,9.37C21.73,9.22 21.78,8.95 21.66,8.73L19.66,5.27C19.54,5.05 19.27,4.96 19.05,5.05L16.56,6.05C16.04,5.66 15.47,5.34 14.86,5.08L14.47,2.44C14.43,2.19 14.21,2 13.95,2H9.94C9.68,2 9.46,2.19 9.42,2.44L9.07,5.08C8.46,5.34 7.89,5.66 7.37,6.05L4.88,5.05C4.66,4.96 4.39,5.05 4.27,5.27L2.27,8.73C2.15,8.95 2.2,9.22 2.39,9.37L4.5,11.03C4.46,11.35 4.43,11.67 4.43,12C4.43,12.33 4.46,12.65 4.5,12.97L2.39,14.63C2.2,14.78 2.15,15.05 2.27,15.27L4.27,18.73C4.39,18.95 4.66,19.04 4.88,18.95L7.37,17.95C7.89,18.34 8.46,18.66 9.07,18.92L9.42,21.56C9.46,21.81 9.68,22 9.94,22H13.95C14.21,22 14.43,21.81 14.47,21.56L14.86,18.92C15.47,18.66 16.04,18.34 16.56,17.95L19.05,18.95C19.27,19.04 19.54,18.95 19.66,18.73L21.66,15.27C21.78,15.05 21.73,14.78 21.54,14.63L19.43,12.97Z" />
            </svg><span data-i18n="nav_set">设置</span></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp, onSnapshot, deleteDoc, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        
        const firebaseConfig = { apiKey: "AIzaSyBNk0S-ArNKrK_fmUZJb6K2U2252rT5FNU", projectId: "restaurant-app-bc3c1" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let cart = [], drinks = [], currentLang = 'zh', timeFmt = '12h', dateFmt = 'YMD', base64 = "", pendingItem = null;
        
        const I18N = {
            zh: {
                table: "桌号 TABLE", search_ph: "搜索饮品...", nav_home: "点餐", nav_cart: "购物车", nav_set: "设置",

                btn_ok: "确定", btn_cancel: "取消", taste: "浓度", sugar: "糖分", size: "分量", remark_ph: "备注...",
                normal: "正常", less_sugar: "少糖", no_sugar: "无糖", big: "大杯", mini: "最小杯", remove_btn: "移除", table_pre: "桌号"
            },
            en: {
                table: "TABLE NUMBER", search_ph: "Search...", nav_home: "MENU", nav_cart: "CART", nav_set: "SETS",
                total: "TOTAL PRICE", history: "HISTORY RECORD", lang_set: "LANGUAGE", theme_set: "THEME MODE",
                time_fmt: "TIME FORMAT", date_fmt: "DATE FORMAT", manage: "COLLECTION MANAGE", 
                manage_title: "CLOUD MANAGE", name_ph: "Name", price_ph: "Price", sync: "SYNC NOW",
                send: "PLACE ORDER", cancel: "CANCEL", confirm: "CONFIRM", err_table: "⚠️ Enter Table No.", 
                pop_sent: "✅ Order Sent", confirm_del: "Delete permanently?", confirm_hist: "Delete record?", 
                btn_ok: "OK", btn_cancel: "CANCEL", taste: "TASTE", sugar: "SUGAR", size: "SIZE", remark_ph: "Remarks...",
                normal: "NORMAL", less_sugar: "LESS SUGAR", no_sugar: "KOSONG", big: "BIG", mini: "MINI", remove_btn: "REMOVE", table_pre: "TABLE"
            }
        };
        
        // --- 时间/日期格式化 ---
        function getFmtTime(d) {
            let h = d.getHours(); const m = d.getMinutes().toString().padStart(2, '0');
            if(timeFmt === '24h') return `${h}:${m}`;
            const sfx = h >= 12 ? " PM" : " AM"; h = h % 12 || 12; return `${h}:${m}${sfx}`;
        }
        function getFmtDate(d) {
            const y = d.getFullYear(); const mo = (d.getMonth()+1).toString().padStart(2, '0'); const day = d.getDate().toString().padStart(2, '0');
            return dateFmt === 'YMD' ? `${y}/${mo}/${day}` : `${day}/${mo}/${y}`;
        }
        function updateClock() {
            const now = new Date();
            document.getElementById('liveClock').innerText = getFmtTime(now);
            document.getElementById('liveDate').innerText = getFmtDate(now);
        }
        setInterval(updateClock, 1000);
        
        // --- 核心弹窗系统 (关键修复) ---
        window.showPop = (msg, onConfirmAction = null) => {
            const overlay = document.getElementById('modalOverlay');
            const btnBox = document.getElementById('modalBtns');
            document.getElementById('modalMsg').innerText = msg;
            btnBox.innerHTML = "";
            if(onConfirmAction) {
                const c = document.createElement('button'); c.className="m-btn m-btn-gray"; c.innerText=I18N[currentLang].btn_cancel; c.onclick=()=>overlay.style.display='none';
                const o = document.createElement('button'); o.className="m-btn m-btn-black"; o.innerText=I18N[currentLang].btn_ok; 
                o.onclick=()=>{ onConfirmAction(); overlay.style.display='none'; };
                btnBox.appendChild(c); btnBox.appendChild(o);
            } else {
                const o = document.createElement('button'); o.className="m-btn m-btn-black"; o.innerText=I18N[currentLang].btn_ok; o.onclick=()=>overlay.style.display='none';
                btnBox.appendChild(o);
            }
            overlay.style.display = 'flex';
        }
        
        // --- 切换逻辑 ---
        window.switchTab = (idx, pageId, el) => {
            document.getElementById('navIndicator').style.transform = `translateX(${idx * 100}%)`;
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('searchArea').style.display = pageId === 'homePage' ? 'block' : 'none';
            document.querySelectorAll('.swipe-body').forEach(b => b.style.transform = 'translateX(0)');
        };
        
        window.setLang = (l, idx) => {
            currentLang = l;
            document.getElementById('langSlider').style.transform = `translateX(${idx * 100}%)`;
            document.querySelectorAll('#langSwitch .sw-btn').forEach((b,i)=>b.classList.toggle('active', i===idx));
            document.querySelectorAll('[data-i18n]').forEach(el => el.innerText = I18N[l][el.getAttribute('data-i18n')]);
            document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = I18N[l][el.getAttribute('data-i18n-ph')]);
            renderCart(); filterMenu(); renderAdmin(); updateClock();
        };
        
        window.setTheme = (mode, idx) => {
            document.getElementById('themeSlider').style.transform = `translateX(${idx * 100}%)`;
            document.querySelectorAll('#themeSwitch .sw-btn').forEach((b,i)=>b.classList.toggle('active', i===idx));
            if(mode === 'auto') {
                const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.body.setAttribute('data-theme', isDark ? 'dark' : 'light');
            } else { document.body.setAttribute('data-theme', mode); }
        };
        
        window.setTimeFmt = (f, idx) => { timeFmt = f; document.getElementById('timeSlider').style.transform = `translateX(${idx * 100}%)`; document.querySelectorAll('#timeSwitch .sw-btn').forEach((b,i)=>b.classList.toggle('active', i===idx)); updateClock(); renderCart(); init(); };
        window.setDateFmt = (f, idx) => { dateFmt = f; document.getElementById('dateSlider').style.transform = `translateX(${idx * 100}%)`; document.querySelectorAll('#dateSwitch .sw-btn').forEach((b,i)=>b.classList.toggle('active', i===idx)); updateClock(); renderCart(); init(); };
        window.toggleManage = (s) => document.getElementById('managePage').classList.toggle('show', s);
        
        window.setOpt = (el, idx) => {
            el.parentElement.querySelector('.sw-slider').style.transform = `translateX(${idx * 100}%)`;
            el.parentElement.querySelectorAll('.sw-btn').forEach((b,i)=>b.classList.toggle('active', i===idx));
        };
        window.openOpt = (drink) => { pendingItem = drink; document.getElementById('optDrinkName').innerText = drink.name; document.getElementById('optionModal').style.display='flex'; };
        window.closeOpt = () => document.getElementById('optionModal').style.display='none';
        window.confirmAdd = () => {
            const t = document.querySelector('#optionModal #tasteSwitch .active')?.innerText || "正常";
            const s = document.querySelector('#optionModal #sugarSwitch .active')?.innerText || "正常";
            const z = document.querySelector('#optionModal #sizeSwitch .active')?.innerText || "正常";
            const r = document.getElementById('customRem').value;
            cart.push({...pendingItem, mods: `${t}/${s}/${z}${r?','+r:''}`});
            renderCart(); closeOpt();
        };
        
        // --- 侧滑组件 ---
        function createSwipeItem(title, price, meta, img, onDel, onAction = null, isDone = false) {
            const container = document.createElement('div'); container.className = 'swipe-container';
            container.innerHTML = `
                <div class="swipe-btn">DELETE</div>
                <div class="swipe-body">
                    <div style="display:flex; align-items:center; flex:1; overflow:hidden;">
                        <div class="admin-logo" style="width:35px; height:35px; margin-right:12px; flex-shrink:0;">${img ? `<img src="${img}">` : '🥤'}</div>
                        <div class="swipe-info"><div class="swipe-sub">${meta}</div><div class="swipe-title">${title}</div><div style="font-size:11px; font-weight:900; margin-top:4px;">RM ${price}</div></div>
                    </div>
                    ${onAction ? `<button class="btn-done-pill">DONE</button>` : (meta.includes('|') ? `` : '')}
                </div>
            `;
            const body = container.querySelector('.swipe-body'); if(isDone) body.style.opacity = 0.4;
            let startX = 0, currentX = 0;
            body.ontouchstart = e => startX = e.touches[0].clientX;
            body.ontouchmove = e => {
                let diff = e.touches[0].clientX - startX;
                if(diff < 0 && diff > -100) body.style.transform = `translateX(${diff}px)`;
                if(diff > 20 && currentX < 0) body.style.transform = `translateX(0)`;
            };
            body.ontouchend = () => {
                const matrix = new WebKitCSSMatrix(window.getComputedStyle(body).transform);
                currentX = matrix.m41 < -40 ? -80 : 0;
                body.style.transform = `translateX(${currentX}px)`;
            };
            container.querySelector('.swipe-btn').onclick = onDel;
            if(onAction) container.querySelector('button').onclick = onAction;
            return container;
        }
        
        // --- 数据渲染 ---
        function init() {
            onSnapshot(collection(db, "drinks"), snap => {
                drinks = []; snap.forEach(d => drinks.push({id: d.id, ...d.data()}));
                filterMenu(); renderAdmin();
            });
            onSnapshot(query(collection(db, "orders"), orderBy("createdAt", "desc")), snap => {
                const list = document.getElementById('historyList'); list.innerHTML = '';
                if(snap.empty) { list.innerHTML = `<div class="empty-hint" data-i18n="empty_hist">暂无记录</div>`; return; }
                snap.forEach(d => {
                    const o = d.data(); const done = o.status === 'completed';
                    const dt = o.createdAt ? new Date(o.createdAt.seconds * 1000) : new Date();
                    const meta = `${I18N[currentLang].table_pre} T${o.table} | ${getFmtTime(dt)}`;
                    const firstImg = drinks.find(dr => dr.name === o.items?.[0])?.img;
                    list.appendChild(createSwipeItem(o.displayStr, o.totalPrice, meta, firstImg,
                        () => window.showPop(I18N[currentLang].confirm_hist, () => deleteDoc(doc(db, "orders", d.id))),
                        done ? null : () => updateDoc(doc(db, "orders", d.id), {status:'completed'}), done));
                });
            });
        }
        
        window.filterMenu = () => {
            const k = document.getElementById('searchInp').value.toLowerCase();
            const grid = document.getElementById('menuGrid'); grid.innerHTML = '';
            drinks.filter(d => d.name.toLowerCase().includes(k)).forEach(d => {
                const card = document.createElement('div'); card.className = 'drink-card';
                card.innerHTML = `<div class="drink-img">${d.img ? `<img src="${d.img}">` : '🥤'}</div><b>${d.name}</b>`;
                card.onclick = () => window.openOpt(d);
                grid.appendChild(card);
            });
        };
        
        window.renderCart = () => {
            const list = document.getElementById('draftList'); list.innerHTML = '';
            const badge = document.getElementById('cartBadge'); const summary = document.getElementById('cartSummary');
            if(cart.length === 0) { 
                list.innerHTML = `<div class="empty-hint" data-i18n="empty_cart">购物车是空的</div>`;
                badge.style.display='none'; summary.style.display='none'; return; 
            }
            let total = 0;
            cart.forEach((it, i) => {
                total += parseFloat(it.price);
                list.appendChild(createSwipeItem(`${it.name} (${it.mods})`, it.price, "", it.img, () => { cart.splice(i,1); renderCart(); }));
            });
            badge.innerText = cart.length; badge.style.display = 'block'; summary.style.display = 'flex';
            document.getElementById('totalPriceDisplay').innerText = `RM ${total.toFixed(2)}`;
        };
        
        window.submitOrder = async () => {
            const t = document.getElementById('tableNum').value; if(!t) return window.showPop(I18N[currentLang].err_table);
            const total = document.getElementById('totalPriceDisplay').innerText.replace('RM ','');
            await addDoc(collection(db, "orders"), { table: t, items: cart.map(i=>i.name), displayStr: cart.map(i=>`${i.name}(${i.mods})`).join(','), totalPrice: total, status: 'pending', createdAt: serverTimestamp() });
            window.showPop(I18N[currentLang].pop_sent); cart = []; renderCart(); document.getElementById('tableNum').value = '';
            window.switchTab(0, 'homePage', document.querySelectorAll('.nav-item')[0]);
        };
        
        window.addDrink = async () => {
            const n = document.getElementById('addName').value, p = document.getElementById('addPrice').value;
            if(!n || !p) return;
            await addDoc(collection(db, "drinks"), { name: n, price: p, img: base64 });
            document.getElementById('addName').value = ''; document.getElementById('addPrice').value = ''; base64 = "";
            window.showPop("OK");
        };
        
        window.handleDeleteDrink = (drinkID) => {
            window.showPop(I18N[currentLang].confirm_del, () => {
                deleteDoc(doc(db, 'drinks', drinkID));
            });
        };
        
        function renderAdmin() {
            const list = document.getElementById('adminDrinkList'); list.innerHTML = '';
            drinks.forEach(d => {
                const el = document.createElement('div'); el.className = 'admin-item';
                const dID = d.id; 
                el.innerHTML = `<div class="admin-logo">${d.img ? `<img src="${d.img}">` : '🥤'}</div><div class="admin-name">${d.name}</div><span style="color:red; font-size:11px; font-weight:bold;" onclick="window.handleDeleteDrink('${dID}')">${I18N[currentLang].remove_btn}</span>`;
                list.appendChild(el);
            });
        }
        
        document.getElementById('fileInp').onchange = (e) => { const r = new FileReader(); r.onload = () => base64 = r.result; r.readAsDataURL(e.target.files[0]); };
        init(); setLang('zh', 0); updateClock(); setTheme('auto', 0);
    </script>
</body>

</html>
