<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EMPLOYEE-SYSTEM PRO</title>
    <style>
        :root {  
            --bg: #ffffff; --text: #000000; --card: #f4f4f4; --border: #e5e5e5;  
            --accent: #ff3b30; --radius: 14px; --transition: all 0.45s cubic-bezier(0.16, 1, 0.3, 1);  
            --success: #34c759; --warning: #ff9500;
        }  
        [data-theme="dark"] { --bg: #000000; --text: #ffffff; --card: #1a1a1a; --border: #333333; }  
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }  
        
        /* --- 核心修复：彻底禁止背景滑动 --- */
        body.modal-open { 
            position: fixed; 
            width: 100%; 
            height: 100%; 
            overflow: hidden !important; 
        }
        
        input, textarea { user-select: text !important; -webkit-user-select: text !important; pointer-events: auto !important; }
        body { user-select: none; -webkit-user-select: none; background: var(--bg); color: var(--text); padding-bottom: 120px; transition: 0.3s; min-height: 100vh; overflow-x: hidden; width: 100%; margin: 0; display: flex; flex-direction: column; align-items: center; }  
        
        .app-container { width: 100%; max-width: 950px; position: relative; }
        
        /* --- 弹窗视觉 (锁定背景点击) --- */  
        .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 40000; backdrop-filter: blur(6px); }  
        .modal-box { background: var(--bg); width: 88%; max-width: 320px; max-height: 92vh; padding: 15px 22px 25px; border-radius: 32px; text-align: center; border: 1px solid var(--border); box-shadow: 0 20px 50px rgba(0,0,0,0.3); animation: modalPop 0.3s var(--transition); display: flex; flex-direction: column; }  
        @keyframes modalPop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }  
        
        .modal-content { flex: 1; overflow-y: auto; scrollbar-width: none; margin-bottom: 10px; }
        .modal-content::-webkit-scrollbar { display: none; }
        
        /* ⚠️ 警告图标同行排列 */
        .modal-header-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 0; margin-bottom: 12px; width: 100%; }
        #warnIconSlot svg { width: 22px; height: 22px; flex-shrink: 0; }
        #modalMsg { font-weight: 800; font-size: 16px; line-height: 1.4; color: var(--text); margin: 0; }
        
        #modalIconArea { margin-bottom: 10px; display: flex; align-items: center; justify-content: center; min-height: 80px; }
        #modalIconArea:empty { display: none; }
        
        .modal-btn-row { display: flex; gap: 10px; margin-top: auto; width: 100%; }  
        .m-btn { flex: 1; height: 50px; border-radius: 15px; border: none; font-weight: 800; cursor: pointer; font-size: 14px; transition: 0.2s; }  
        .m-btn:active { transform: scale(0.96); }
        .m-btn-black { background: var(--text); color: var(--bg); }  
        .m-btn-gray { background: var(--card); color: var(--text); }  
        
        /* --- 堂食/外带设计 --- */
        .dining-selector { display: flex; gap: 8px; margin-bottom: 15px; }
        .dining-btn { flex: 1; padding: 12px; border-radius: 18px; background: var(--card); border: 2px solid transparent; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
        .dining-btn.active { border-color: var(--text); background: var(--bg); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .dining-btn svg { width: 26px; height: 26px; fill: none; stroke: var(--text); stroke-width: 2.2; }
        .dining-btn small { font-size: 10px; font-weight: 800; }
        
        /* --- 滑块切换器 --- */
        .switcher { background: var(--card); padding: 4px; border-radius: 12px; display: flex; position: relative; height: 42px; margin-bottom: 12px; align-items: center; isolation: isolate; }  
        .sw-btn { flex: 1; z-index: 2; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; color: #888; cursor: pointer; height: 100%; position: relative; transition: 0.3s; }  
        .sw-btn.active { color: var(--bg) !important; } 
        .sw-slider { position: absolute; top: 4px; bottom: 4px; background: var(--text); border-radius: 10px; transition: var(--transition); z-index: 1; pointer-events: none; }
        
        /* --- Header --- */  
        .header { padding: 30px 20px 15px; display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid var(--border); background: var(--bg); width: 100%; position: relative; z-index: 1000; }  
        .time-display { font-size: 34px; font-weight: 900; line-height: 1; letter-spacing: -1.5px; }  
        .date-display { font-size: 11px; font-weight: 800; opacity: 0.4; margin-top: 6px; }  
        .table-card { background: var(--text); color: var(--bg); padding: 8px 12px; border-radius: 10px; text-align: center; cursor: pointer; position: relative; z-index: 2000; }  
        .table-input { background: transparent; border: none; color: inherit; font-size: 22px; font-weight: bold; width: 55px; text-align: center; outline: none; -webkit-appearance: none; }  
        
        /* --- 列表视觉 --- */  
        .swipe-container { position: relative; overflow: hidden; border-radius: 12px; margin-bottom: 10px; background: var(--accent); width: 100%; }  
        .swipe-body { background: var(--card); padding: 15px; display: flex; align-items: center; gap: 12px; transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); position: relative; z-index: 5; min-height: 80px; border-radius: 12px; }  
        .swipe-del-btn { position: absolute; right: 0; top: 0; width: 80px; height: 100%; display: flex; align-items: center; justify-content: center; color: white; font-size: 11px; font-weight: 900; z-index: 1; cursor: pointer; }  
        .swipe-info-box { flex: 1; min-width: 0; overflow: hidden; text-align: left; } 
        .swipe-title { font-weight: 700; font-size: 14px; color: var(--text); overflow-wrap: break-word; word-break: normal; line-height: 1.3; }
        
        .swipe-body.is-completed { background: #d0d0d0 !important; color: #000000 !important; }
        .swipe-body.is-completed .status-btn { background: #000 !important; color: #fff !important; opacity: 1 !important; z-index: 10; }
        .status-btn { background: var(--text); color: var(--bg); border: none; padding: 10px; border-radius: 10px; font-size: 10px; font-weight: 900; width: 85px; flex-shrink: 0; cursor: pointer; transition: 0.3s; }  
        
        /* --- 强制手机 3 列适配 --- */
        .page { display: none; padding: 0 20px; animation: fadeIn 0.3s ease; width: 100%; }  
        .page.active { display: block; }  
        .menu-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 15px; width: 100%; }  
        @media (min-width: 600px) { .menu-grid { grid-template-columns: repeat(auto-fill, minmax(115px, 1fr)); } }
        
        .drink-card { background: var(--card); border-radius: 16px; padding: 12px 6px; text-align: center; transition: 0.15s; cursor: pointer; }
        .drink-img { width: 100%; aspect-ratio: 1/1; background: #eee; border-radius: 12px; margin-bottom: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }  
        .drink-img img { width: 100%; height: 100%; object-fit: cover; }  
        
        /* --- 底部导航 --- */  
        .nav-dock { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 450px; height: 72px; background: var(--bg); border: 2px solid var(--text); border-radius: 24px; display: flex; align-items: center; z-index: 1000; padding: 0 4px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }  
        .nav-indicator { position: absolute; top: 6px; left: 6px; width: calc(33.33% - 4.5px); height: 58px; background: var(--text); border-radius: 18px; transition: var(--transition); z-index: 1; pointer-events: none; }  
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; color: #aaa; cursor: pointer; position: relative; height: 100%; background: none; border: none; outline: none; }  
        .nav-item.active { color: var(--bg); }  
        .nav-item svg { width: 26px; height: 26px; fill: currentColor; margin-bottom: 2px; }  
        .nav-item span { font-size: 10px; font-weight: 800; }
        .badge { position: absolute; top: 8px; right: 20%; background: var(--accent); color: white; padding: 2px 5px; border-radius: 10px; font-size: 9px; font-weight: 900; border: 2px solid var(--bg); min-width: 18px; z-index: 15; }  
        
        /* --- 管理页自适应 --- */
        .admin-entry { display: flex; align-items: center; justify-content: space-between; padding: 20px; background: var(--card); border-radius: 16px; margin-top: 25px; cursor: pointer; width: 100%; }
        #managePage { 
            position: fixed; 
            top: 0; 
            left: 50%; 
            transform: translateX(100%); 
            width: 100%; 
            max-width: 1000px; 
            height: 100%; 
            background: var(--bg); 
            z-index: 30000 !important; 
            padding: 40px 20px; 
            overflow-y: auto; 
            transition: var(--transition); 
            box-shadow: -10px 0 30px rgba(0,0,0,0.1);
        }  
        #managePage.show { transform: translateX(-50%); } 
        
        .admin-item { display: flex; align-items: center; padding: 12px; background: var(--card); border-radius: 14px; margin-bottom: 10px; gap: 12px; width: 100%; border: 1px solid var(--border); }
        .admin-info { flex: 1; min-width: 0; text-align: left; }
        .del-x-btn { background: #fee; color: #ff3b30; padding: 8px 14px; border-radius: 10px; font-size: 11px; font-weight: 800; cursor: pointer; border: 1px solid #ffcccc; margin-left: auto; flex-shrink: 0; }
        
        #toast { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); color: #fff; padding: 14px 22px; border-radius: 12px; font-size: 13px; z-index: 100000; transition: 0.4s; display: flex; align-items: center; gap: 10px; visibility: hidden; }  
        #toast.show { top: 30px; visibility: visible; }  
    </style>
</head>

<body>

    <div id="toast">✅ <span id="toastMsg"></span></div>

    <div class="app-container">

        <!-- 定制规格弹窗 -->
        <div id="optionModal" class="modal-overlay">
            <div class="modal-box">
                <h3 id="optDrinkName" style="font-weight:900; font-size:22px; margin-bottom:5px;"></h3>
                <div id="optPriceDisplay" style="font-size:18px; font-weight:900; color:var(--accent); margin-bottom:15px;">RM 0.00</div>

                <div class="modal-content">
                    <p style="font-size:10px; font-weight:800; color:#aaa; margin-bottom:10px;" data-i18n="dining_mode">用餐方式 DINING</p>
                    <div class="dining-selector">
                        <div class="dining-btn active" id="btnDineIn" onclick="setDiningUI('dine_in')">
                            <svg viewBox="0 0 24 24">
                                <path d="M3 10l9-7 9 7M5 10v10a1 1 0 001 1h12a1 1 0 001-1V10M9 21v-7h6v7" />
                            </svg>
                            <small data-i18n="dine_in">堂食</small>
                        </div>
                        <div class="dining-btn" id="btnTakeaway" onclick="setDiningUI('takeaway')">
                            <svg viewBox="0 0 24 24">
                                <path d="M6 8V7a6 6 0 1112 0v1M4 8h16l1 12H3L4 8z" />
                            </svg>
                            <small data-i18n="takeaway">外带</small>
                        </div>
                    </div>

                    <p style="font-size:10px; font-weight:800; color:#aaa; margin-bottom:5px;" data-i18n="taste">浓度 TASTE</p>
                    <div class="switcher" id="tasteSwitch">
                        <div class="sw-slider"></div>
                        <div class="sw-btn active" onclick="setOptUI(this, 0)" data-i18n="normal">正常</div>
                        <div class="sw-btn" onclick="setOptUI(this, 1)" data-i18n="gau">厚(Gau)</div>
                        <div class="sw-btn" onclick="setOptUI(this, 2)" data-i18n="po">薄(Po)</div>
                    </div>

                    <p style="font-size:10px; font-weight:800; color:#aaa; margin-bottom:5px;" data-i18n="sugar_set">糖分 SUGAR</p>
                    <div class="switcher" id="sugarSwitch">
                        <div class="sw-slider"></div>
                        <div class="sw-btn active" onclick="setOptUI(this, 0)" data-i18n="normal">正常</div>
                        <div class="sw-btn" onclick="setOptUI(this, 1)" data-i18n="less_sugar">少糖</div>
                        <div class="sw-btn" onclick="setOptUI(this, 2)" data-i18n="no_sugar">无糖</div>
                    </div>

                    <p style="font-size:10px; font-weight:800; color:#aaa; margin-bottom:5px;" data-i18n="size_set">分量 SIZE</p>
                    <div class="switcher" id="sizeSwitch">
                        <div class="sw-slider"></div>
                        <div class="sw-btn" onclick="changeSize(this, 0)" data-i18n="big_cup">大杯</div>
                        <div class="sw-btn active" onclick="changeSize(this, 1)" data-i18n="small_cup">小杯</div>
                        <div class="sw-btn" onclick="changeSize(this, 2)" data-i18n="mini_cup">最小杯</div>
                    </div>

                    <div style="display:flex; align-items:center; justify-content:space-between; background:var(--card); padding:8px; border-radius:35px; width:150px; margin:20px auto;">
                        <button class="m-btn-black" style="width:40px;height:40px;border-radius:50%;border:none;font-size:20px;cursor:pointer;" onclick="window.changeQty(-1)">−</button>
                        <span id="qtyVal" style="font-size:22px; font-weight:900;">1</span>
                        <button class="m-btn-black" style="width:40px;height:40px;border-radius:50%;border:none;font-size:20px;cursor:pointer;" onclick="window.changeQty(1)">+</button>
                    </div>
                    <input type="text" id="customRem" style="width:100%; padding:15px; background:var(--card); border:none; border-radius:14px; font-size:13px; font-weight:600; outline:none;" data-i18n-ph="remark_ph" placeholder="备注...">
                </div>
                <div class="modal-btn-row">
                    <button class="m-btn m-btn-gray" onclick="window.closeOpt()" data-i18n="cancel">取消</button>
                    <button class="m-btn m-btn-black" onclick="window.confirmAdd()" data-i18n="confirm">确定</button>
                </div>
            </div>
        </div>

        <!-- 通用提示弹窗 -->
        <div id="modalOverlay" class="modal-overlay">
            <div id="modalBox" class="modal-box">
                <div id="modalIconArea"></div>
                <div class="modal-header-row">
                    <div id="warnIconSlot"></div>
                    <p id="modalMsg"></p>
                </div>
                <div class="modal-btn-row" id="modalBtns"></div>
            </div>
        </div>

        <div class="header">
            <div class="header-left">
                <div style="font-size:10px; font-weight:900; opacity:0.4;">EMPLOYEE-SYSTEM</div>
                <div class="time-display" id="liveClock">--:--</div>
                <div class="date-display" id="liveDate">----/--/--</div>
            </div>
            <div class="table-card" onclick="document.getElementById('tableNum').focus()">
                <small data-i18n="table">桌号 TABLE</small>
                <input type="number" id="tableNum" class="table-input" placeholder="01" onclick="event.stopPropagation()">
            </div>
        </div>

        <div id="homePage" class="page active">
            <div style="padding:15px 0;">
                <div style="background:var(--card); padding:12px 18px; border-radius:16px; display:flex; align-items:center; gap:10px;">
                    <svg style="width:18px; height:18px; stroke:var(--text); fill:none; stroke-width:2.5; opacity:0.3;" viewBox="0 0 24 24">
                        <circle cx="11" cy="11" r="7" />
                        <line x1="21" y1="21" x2="16.65" y2="16.65" />
                    </svg>
                    <input type="text" id="searchInp" oninput="window.filterMenu()" style="background:transparent; border:none; width:100%; outline:none; font-size:14px; font-weight:600;" data-i18n-ph="search_ph" placeholder="搜索饮品...">
                </div>
            </div>
            <div class="menu-grid" id="menuGrid"></div>
        </div>

        <div id="cartPage" class="page">
            <h3 style="font-size:11px; margin: 15px 0; opacity:0.5;" data-i18n="nav_cart">购物车 CART</h3>
            <div id="draftList"></div>
            <div id="cartSummary" style="display:none; margin-top:20px; background:var(--text); color:var(--bg); padding:22px; border-radius:18px; justify-content:space-between; align-items:center;">
                <div>
                    <p style="font-size:9px; opacity:0.6;" data-i18n="total">总计</p>
                    <div id="totalPriceDisplay" style="font-size:24px; font-weight:900;">RM 0.00</div>
                </div>
                <button onclick="submitOrder()" style="background:var(--bg); color:var(--text); border:none; padding:12px 22px; border-radius:12px; font-weight:900;" data-i18n="send">发送订单</button>
            </div>
            <h3 style="font-size:11px; margin: 40px 0 15px; opacity:0.5;" data-i18n="history">历史记录 HISTORY</h3>
            <div id="historyList"></div>
        </div>

        <div id="settingsPage" class="page">
            <h3 style="font-size:11px; opacity:0.6; margin: 15px 0 8px;" data-i18n="theme_set">主题模式 THEME</h3>
            <div class="switcher" id="themeSwitch">
                <div class="sw-slider"></div>
                <div class="sw-btn active" onclick="setTheme('auto', 0)" data-i18n="auto">自动</div>
                <div class="sw-btn" onclick="setTheme('light', 1)" data-i18n="light">亮色</div>
                <div class="sw-btn" onclick="setTheme('dark', 2)" data-i18n="dark">深色</div>
            </div>
            <h3 style="font-size:11px; opacity:0.6; margin: 15px 0 8px;" data-i18n="lang_set">语言 LANGUAGE</h3>
            <div class="switcher" id="langSwitch">
                <div class="sw-slider"></div>
                <div class="sw-btn active" onclick="setLang('zh', 0)">中文</div>
                <div class="sw-btn" onclick="setLang('en', 1)">ENGLISH</div>
            </div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
                <div>
                    <h3 style="font-size:10px; opacity:0.6; margin-bottom:5px;" data-i18n="time_fmt">时间格式</h3>
                    <div class="switcher" id="timeSwitch_ctrl">
                        <div class="sw-slider"></div>
                        <div class="sw-btn active" onclick="setTimeFmt('12h', 0)">12H</div>
                        <div class="sw-btn" onclick="setTimeFmt('24h', 1)">24H</div>
                    </div>
                </div>
                <div>
                    <h3 style="font-size:10px; opacity:0.6; margin-bottom:5px;" data-i18n="date_fmt">日期格式</h3>
                    <div class="switcher" id="dateSwitch_ctrl">
                        <div class="sw-slider"></div>
                        <div class="sw-btn active" onclick="setDateFmt('YMD', 0)">YMD</div>
                        <div class="sw-btn" onclick="setDateFmt('DMY', 1)">DMY</div>
                    </div>
                </div>
            </div>
            <div class="admin-entry" onclick="toggleManage(true)">
                <div style="display:flex; align-items:center; gap:12px;">
                    <div style="background:#fff; width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; border:1px solid #eee; font-size:20px;">🥤</div>
                    <span data-i18n="manage" style="font-weight:800; font-size:15px;">菜单管理 (增/删)</span>
                </div>
                <span style="opacity:0.3; font-size:20px;">›</span>
            </div>
        </div>

        <!-- 管理页 -->
        <div id="managePage">
            <svg style="width:30px; stroke:var(--text); stroke-width:2.5; fill:none; margin-bottom:20px; cursor:pointer;" viewBox="0 0 24 24" onclick="toggleManage(false)">
                <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
            <h2 style="font-size:24px; font-weight:900; margin-bottom:20px;" data-i18n="manage_title">管理云端菜单</h2>
            <div style="background:var(--card); padding:20px; border-radius:20px; margin-bottom:25px;">
                <label for="fileInp" id="fileLabel" style="display:block; padding:15px; background:var(--text); color:var(--bg); border-radius:10px; text-align:center; font-size:12px; font-weight:900; margin-bottom:15px; cursor:pointer;" data-i18n="select_file">选择图片</label>
                <input type="file" id="fileInp" accept="image/*" style="display:none;">
                <input type="text" id="addName" data-i18n-ph="name_ph" placeholder="名称" style="width:100%; padding:15px; border-radius:10px; border:1px solid #ddd; margin-bottom:12px; outline:none; background:var(--bg); color:var(--text); font-weight:600;">
                <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:15px;">
                    <div><small style="font-size:9px; opacity:0.5;" data-i18n="big_cup">大杯</small><input type="number" id="pBig" placeholder="0.00" style="width:100%; padding:12px; border-radius:10px; border:1px solid #ddd; outline:none; background:var(--bg); color:var(--text); font-size:14px; text-align:left;"></div>
                    <div><small style="font-size:9px; opacity:0.5;" data-i18n="small_cup">小杯</small><input type="number" id="pSmall" placeholder="0.00" style="width:100%; padding:12px; border-radius:10px; border:1px solid #ddd; outline:none; background:var(--bg); color:var(--text); font-size:14px; text-align:left;"></div>
                    <div><small style="font-size:9px; opacity:0.5;" data-i18n="mini_cup">最小杯</small><input type="number" id="pMini" placeholder="0.00" style="width:100%; padding:12px; border-radius:10px; border:1px solid #ddd; outline:none; background:var(--bg); color:var(--text); font-size:14px; text-align:left;"></div>
                </div>
                <button id="addBtn" onclick="addDrink()" style="width:100%; padding:20px; background:var(--text); color:var(--bg); border:none; border-radius:14px; font-weight:900;" data-i18n="sync">同步到云端</button>
            </div>
            <div id="adminDrinkList"></div>
        </div>

        <div class="nav-dock">
            <div id="navIndicator" class="nav-indicator"></div>
            <button class="nav-item active" onclick="switchTab(0, 'homePage', this)"><svg viewBox="0 0 24 24">
                    <path d="M10,20V14H14V20H19V12H22L12,3L2,12H5V20H10Z" />
                </svg><span data-i18n="nav_home">点餐</span></button>
            <button class="nav-item" onclick="switchTab(1, 'cartPage', this)">
                <div id="cartBadge" class="badge" style="display:none">0</div><svg viewBox="0 0 24 24">

            <button class="nav-item" onclick="switchTab(2, 'settingsPage', this)"><svg viewBox="0 0 24 24">
                    <path d="M12,15.5A3.5,3.5 0 0,1 8.5,12A3.5,3.5 0 0,1 12,8.5A3.5,3.5 0 0,1 15.5,12A3.5,3.5 0 0,1 12,15.5M19.43,12.97C19.47,12.65 19.5,12.33 19.5,12C19.5,11.67 19.47,11.35 19.43,11.03L21.54,9.37C21.73,9.22 21.73,8.95 21.66,8.73L19.66,5.27C19.54,5.05 19.27,4.96 19.05,5.05L16.56,6.05C16.04,5.66 15.47,5.34 14.86,5.08L14.47,2.44C14.43,2.19 14.21,2 13.95,2H9.94C9.68,2 9.46,2.19 9.42,2.44L9.07,5.08C8.46,5.34 7.89,5.66 7.37,6.05L4.88,5.05C4.66,4.96 4.39,5.05 4.27,5.27L2.27,8.73C2.15,8.95 2.2,9.22 2.39,9.37L4.5,11.03C4.46,11.35 4.43,11.67 4.43,12C4.43,12.33 4.46,12.65 4.5,12.97L2.39,14.63C2.2,14.78 2.15,15.05 2.27,15.27L4.27,18.73C4.39,18.95 4.66,19.04 4.88,18.95L7.37,17.95C7.89,18.34 8.46,18.66 9.07,18.92L9.42,21.56C9.46,21.81 9.68,22 9.94,22H13.95C14.21,22 14.43,21.81 14.47,21.56L14.86,18.92C15.47,18.66 16.04,18.34 16.56,17.95L19.05,18.95C19.27,19.04 19.54,18.95 19.66,18.73L21.66,15.27C21.78,15.05 21.73,14.78 21.54,14.63L19.43,12.97Z" />

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";  
        import { getFirestore, collection, addDoc, serverTimestamp, onSnapshot, deleteDoc, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";  
        
        const firebaseConfig = { apiKey: "AIzaSyBNk0S-ArNKrK_fmUZJb6K2U2252rT5FNU", projectId: "restaurant-app-bc3c1" };  
        const app = initializeApp(firebaseConfig);  
        const db = getFirestore(app);  
        
        let cart = [], drinks = [], ordersData = [], currentLang = 'zh', timeFmt = '12h', dateFmt = 'YMD', base64 = "", pendingItem = null, curQty = 1, curSelectedPrice = 0, curDiningMode = "dine_in";  
        
        const I18N = {  
            zh: { nav_home: "点餐", nav_cart: "购物车", nav_set: "设置", total: "总计", history: "历史记录 HISTORY", lang_set: "系统语言 LANGUAGE", theme_set: "主题模式 THEME", manage: "菜单管理 (增/删)", sync: "同步到云端", send: "发送订单", cancel: "取消", confirm: "确定", err_table: "请先输入桌号！", pop_sent: "订单发送成功", confirm_del: "确定从云端删除？", btn_ok: "确定", remark_ph: "备注...", normal: "正常", gau: "厚(Gau)", po: "薄(Po)", less_sugar: "少糖", no_sugar: "无糖", big_cup: "大杯", small_cup: "小杯", mini_cup: "最小杯", empty_cart: "购物车是空的", empty_hist: "暂无订单", added_to_cart: "已添加 %n", st_pending: "未完成", st_done: "已完成", remove: "移除", add_success: "云端同步成功", select_file: "选择图片", table: "桌号 TABLE", search_ph: "搜索饮品...", name_ph: "名称", price_ph: "单价", time_fmt: "时间格式", date_fmt: "日期格式", manage_title: "管理云端菜单", auto: "自动", light: "亮色", dark: "深色", dine_in: "堂食", takeaway: "外带", dining_mode: "用餐方式" },  
            en: { nav_home: "MENU", nav_cart: "CART", nav_set: "SET", total: "TOTAL", history: "HISTORY", lang_set: "LANGUAGE", theme_set: "THEME MODE", manage: "MANAGE MENU", sync: "SYNC", send: "SEND", err_table: "Please enter table no.!", pop_sent: "Order Sent Successfully", confirm_del: "Delete from cloud?", confirm: "Confirm", cancel: "Cancel", btn_ok: "OK", remark_ph: "Remarks...", normal: "Normal", gau: "Gau", po: "Po", less_sugar: "Less Sugar", no_sugar: "No Sugar", big_cup: "Large", small_cup: "Small", mini_cup: "Mini", empty_cart: "Your cart is empty", empty_hist: "No orders yet", added_to_cart: "Added %n", st_pending: "PENDING", st_done: "DONE", remove: "REMOVE", add_success: "Sync Success", select_file: "SELECT IMAGE", table: "TABLE", search_ph: "Search...", name_ph: "Name", price_ph: "Unit Price", time_fmt: "TIME FORMAT", date_fmt: "DATE FORMAT", manage_title: "MANAGE CLOUD MENU", auto: "AUTO", light: "LIGHT", dark: "DARK", dine_in: "DINE-IN", takeaway: "TAKEAWAY", dining_mode: "DINING" }  
        };  
        
        const saveLocalOrders = (data) => localStorage.setItem('emp_sys_local_orders', JSON.stringify(data));
        const loadLocalOrders = () => JSON.parse(localStorage.getItem('emp_sys_local_orders') || '[]');
        function saveSet(k,v){ localStorage.setItem('emp_sys_'+k, v); }
        function loadSet(k,def){ return localStorage.getItem('emp_sys_'+k) || def; }
        
        function formatTime(d) {
            if(!d) return "--:--";
            let h = d.getHours(); const m = d.getMinutes().toString().padStart(2, '0');
            if(timeFmt === '24h') return `${h.toString().padStart(2, '0')}:${m}`;
            const sfx = h >= 12 ? " PM" : " AM"; h = h % 12 || 12;
            return `${h.toString().padStart(2, '0')}:${m}${sfx}`;
        }
        
        function createSwipeItem(title, price, meta, img, onDel, onAction = null, qty = 1, isDone = false) {  
            const container = document.createElement('div'); container.className = 'swipe-container';  
            const label = isDone ? I18N[currentLang].st_done : I18N[currentLang].st_pending;
            container.innerHTML = `<div class="swipe-del-btn" id="del">DELETE</div><div class="swipe-body ${isDone?'is-completed':''}" id="bdy"><div style="display:flex; align-items:center; flex:1; min-width:0;"><div class="drink-img" style="width:38px;height:38px;margin-right:10px;margin-bottom:0;flex-shrink:0;">${img ? `<img src="${img}">` : '🥤'}</div><div class="swipe-info-box"><div style="font-size:10px; opacity:0.5;">${meta}</div><div class="swipe-title">${title} ${qty > 1 ? `<span style="background:#000; color:#fff; padding:2px 6px; border-radius:6px; font-size:10px;">x${qty}</span>` : ''}</div><div style="font-size:11px; font-weight:900;">RM ${price}</div></div></div>${onAction ? `<button class="status-btn" id="act">${label}</button>` : ''}</div>`;  
            const body = container.querySelector('#bdy'); let startX = 0, isSwiped = false;
            body.ontouchstart = e => { startX = e.touches[0].clientX; body.style.transition = 'none'; };
            body.ontouchmove = e => { let move = (isSwiped ? -80 : 0) + (e.touches[0].clientX - startX); if (move > 0) move = 0; if (move < -80) move = -80; body.style.transform = `translateX(${move}px)`; };
            body.ontouchend = () => { body.style.transition = 'transform 0.3s cubic-bezier(0.16, 1, 0.3, 1)'; isSwiped = new WebKitCSSMatrix(window.getComputedStyle(body).transform).m41 < -40; body.style.transform = `translateX(${isSwiped ? -80 : 0}px)`; };
            container.querySelector('#del').onclick = () => onDel();
            if(onAction) container.querySelector('#act').onclick = () => onAction();
            return container;  
        }
        
        window.setOptUI = (el, idx) => { 
            if(!el) return;
            const parent = el.parentElement; const slider = parent.querySelector('.sw-slider'); const buttons = parent.querySelectorAll('.sw-btn');
            const count = buttons.length; slider.style.width = `calc(${100 / count}% - 8px)`; slider.style.left = `calc(${(idx * 100) / count}% + 4px)`; 
            buttons.forEach((b,i) => b.classList.toggle('active', i===idx)); 
        };
        
        window.setDiningUI = (mode) => {
            curDiningMode = mode;
            document.getElementById('btnDineIn').classList.toggle('active', mode === 'dine_in');
            document.getElementById('btnTakeaway').classList.toggle('active', mode === 'takeaway');
        };
        
        window.setLang = (l, idx) => {  
            currentLang = l; saveSet('lang', l); saveSet('lang_idx', idx);
            const langBtn = document.querySelectorAll('#langSwitch .sw-btn')[idx];
            if(langBtn) setOptUI(langBtn, parseInt(idx));
            document.querySelectorAll('[data-i18n]').forEach(el => el.innerText = I18N[l][el.getAttribute('data-i18n')] || el.innerText);  
            document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = I18N[l][el.getAttribute('data-i18n-ph')] || el.placeholder);  
            document.querySelectorAll('.switcher').forEach(sw => { const act = sw.querySelector('.active'); if(act) { const btns = Array.from(sw.querySelectorAll('.sw-btn')); setOptUI(act, btns.indexOf(act)); } });
            renderCart(); renderHistory(); filterMenu(); renderAdmin(); updateClock();
        };  
        
        window.setTimeFmt = (f, i) => { timeFmt = f; saveSet('timeFmt', f); saveSet('time_idx', i); setOptUI(document.querySelectorAll('#timeSwitch_ctrl .sw-btn')[i], i); updateClock(); renderHistory(); };
        window.setDateFmt = (f, i) => { dateFmt = f; saveSet('dateFmt', f); saveSet('date_idx', i); setOptUI(document.querySelectorAll('#dateSwitch_ctrl .sw-btn')[i], i); updateClock(); renderHistory(); };
        window.setTheme = (m, i) => { saveSet('theme', m); saveSet('theme_idx', i); setOptUI(document.querySelectorAll('#themeSwitch .sw-btn')[i], i); let actual = m === 'auto' ? (window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light') : m; document.body.setAttribute('data-theme', actual); };
        
        function updateClock() { const now = new Date(); document.getElementById('liveClock').innerText = formatTime(now); const y = now.getFullYear(), mo = (now.getMonth()+1).toString().padStart(2, '0'), d = now.getDate().toString().padStart(2, '0'); document.getElementById('liveDate').innerText = dateFmt === 'YMD' ? `${y}/${mo}/${d}` : `${d}/${mo}/${y}`; }  
        setInterval(updateClock, 1000);  
        
        function init() {  
            onSnapshot(query(collection(db, "drinks"), orderBy("createdAt", "asc")), snap => { drinks = []; snap.forEach(d => drinks.push({id: d.id, ...d.data()})); filterMenu(); renderAdmin(); });  
            ordersData = loadLocalOrders(); renderHistory();
            window.setLang(loadSet('lang', 'zh'), loadSet('lang_idx', 0));
            window.setTimeFmt(loadSet('timeFmt', '12h'), loadSet('time_idx', 0));
            window.setDateFmt(loadSet('dateFmt', 'YMD'), loadSet('date_idx', 0));
            window.setTheme(loadSet('theme', 'auto'), loadSet('theme_idx', 0));
        }  
        
        window.filterMenu = () => { 
            const k = document.getElementById('searchInp').value.toLowerCase(); const grid = document.getElementById('menuGrid'); grid.innerHTML = ''; 
            drinks.filter(d => d.name.toLowerCase().includes(k)).forEach(d => { 
                const card = document.createElement('div'); card.className = 'drink-card'; 
                const pShow = d.pSmall || d.pBig || d.pMini || 0;
                card.innerHTML = `<div class="drink-img">${d.img ? `<img src="${d.img}">` : '🥤'}</div><div style="font-weight: 800; font-size: 13px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${d.name}</div><div style="font-size: 11px; font-weight: 900; color: var(--text); margin-top: 4px;">RM ${(parseFloat(pShow)).toFixed(2)}</div>`; 
                card.onclick = () => window.openOpt(d); grid.appendChild(card); 
            }); 
        };
        
        window.changeSize = (el, idx) => {
            setOptUI(el, idx);
            if(idx === 0) curSelectedPrice = pendingItem.pBig || 0;
            else if(idx === 1) curSelectedPrice = pendingItem.pSmall || 0;
            else curSelectedPrice = pendingItem.pMini || 0;
            document.getElementById('optPriceDisplay').innerText = `RM ${parseFloat(curSelectedPrice).toFixed(2)}`;
        };
        
        function renderHistory() { 
            const list = document.getElementById('historyList'); if(!list) return; list.innerHTML = ''; 
            if(ordersData.length === 0) { list.innerHTML = `<div style="text-align:center; padding:30px; color:#999;">${I18N[currentLang].empty_hist}</div>`; return; } 
            ordersData.forEach((o, index) => { 
                const dt = new Date(o.createdAt);
                list.appendChild(createSwipeItem(o.displayStr, o.totalPrice, `T${o.table} | ${formatTime(dt)}`, null, 
                () => { ordersData.splice(index, 1); saveLocalOrders(ordersData); renderHistory(); }, 
                () => { ordersData[index].status = o.status === 'completed' ? 'pending' : 'completed'; saveLocalOrders(ordersData); renderHistory(); }, 1, o.status === 'completed')); 
            }); 
        }
        
        window.renderCart = () => { const list = document.getElementById('draftList'); if(!list) return; list.innerHTML = ''; const badge = document.getElementById('cartBadge'), summary = document.getElementById('cartSummary'); if(cart.length === 0) { list.innerHTML = `<div style="text-align:center; padding:30px; color:#999;">${I18N[currentLang].empty_cart}</div>`; badge.style.display='none'; summary.style.display='none'; return; } let total = 0, count = 0; cart.forEach((it, i) => { const sub = parseFloat(it.price) * it.qty; total += sub; count += it.qty; list.appendChild(createSwipeItem(`${it.name} ${it.displayMods}`, sub.toFixed(2), "", it.img, () => { cart.splice(i,1); renderCart(); }, null, it.qty)); }); badge.innerText = count; badge.style.display = 'block'; summary.style.display = 'flex'; document.getElementById('totalPriceDisplay').innerText = `RM ${total.toFixed(2)}`; };  
        
        window.confirmAdd = () => {  
            const tK = document.querySelector('#tasteSwitch .active').innerText, sK = document.querySelector('#sugarSwitch .active').innerText, zK = document.querySelector('#sizeSwitch .active').innerText, r = document.getElementById('customRem').value.trim();  
            const mods = [ (curDiningMode === 'takeaway' ? I18N[currentLang].takeaway : ''), tK==="正常"||tK==="Normal"?'':tK, sK==="正常"||sK==="Normal"?'':sK, zK==="小杯"||zK==="Small"?'':zK].filter(v=>v!=='');  
            const ds = mods.length > 0 ? `(${mods.join('/')}${r ? ', ' + r : ''})` : (r ? `(${r})` : '');  
            const existing = cart.find(item => item.name === pendingItem.name && item.displayMods === ds);
            if (existing) { existing.qty += curQty; } else { cart.push({ ...pendingItem, price: curSelectedPrice, displayMods: ds, qty: curQty }); }
            window.showToast(I18N[currentLang].added_to_cart.replace('%n', pendingItem.name)); renderCart(); window.closeOpt(); 
            document.body.classList.remove('modal-open');
        };  
        
        window.openOpt = (drink) => { 
            pendingItem = drink; curQty = 1; 
            document.getElementById('optDrinkName').innerText = drink.name; 
            document.getElementById('qtyVal').innerText = "1"; document.getElementById('customRem').value = ""; setDiningUI('dine_in'); 
            setOptUI(document.querySelectorAll('#tasteSwitch .sw-btn')[0], 0); 
            setOptUI(document.querySelectorAll('#sugarSwitch .sw-btn')[0], 0); 
            changeSize(document.querySelectorAll('#sizeSwitch .sw-btn')[1], 1); 
            document.getElementById('optionModal').style.display = 'flex'; 
            document.body.classList.add('modal-open');
        };  
        
        window.closeOpt = () => {
            document.getElementById('optionModal').style.display='none';
            document.body.classList.remove('modal-open');
        };
        
        window.switchTab = (idx, pageId, el) => { document.getElementById('navIndicator').style.transform = `translateX(${idx * 100}%)`; document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); document.getElementById(pageId).classList.add('active'); document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active')); el.classList.add('active'); document.querySelectorAll('.swipe-body').forEach(b => b.style.transform = 'translateX(0)'); };  
        window.changeQty = (d) => { curQty = Math.max(1, curQty + d); document.getElementById('qtyVal').innerText = curQty; };  
        
        window.submitOrder = async () => { 
            const t = document.getElementById('tableNum').value; if(!t) return window.showPop(I18N[currentLang].err_table, null, false, true); 
            const ds = cart.map(it => `${it.name}${it.qty>1?'x'+it.qty:''} ${it.displayMods}`).join(', '); 
            const priceVal = document.getElementById('totalPriceDisplay').innerText.replace('RM ','');
            await addDoc(collection(db, "orders"), { table: t, displayStr: ds, totalPrice: priceVal, status: 'pending', createdAt: serverTimestamp() }); 
            const localOrder = { id: Date.now().toString(), table: t, displayStr: ds, totalPrice: priceVal, status: 'pending', createdAt: new Date().toISOString() };
            ordersData.unshift(localOrder); saveLocalOrders(ordersData);
            window.showPop(I18N[currentLang].pop_sent, null, true); 
            cart = []; renderCart(); document.getElementById('tableNum').value = ''; renderHistory();
        };  
        
        window.renderAdmin = () => { 
            const list = document.getElementById('adminDrinkList'); if(!list) return; list.innerHTML = ''; 
            drinks.forEach(d => { 
                const el = document.createElement('div'); el.className = 'admin-item'; 
                el.innerHTML = `<div class="drink-img" style="width:40px;height:40px;margin-bottom:0;">${d.img ? `<img src="${d.img}">` : '🥤'}</div><div class="admin-info"><b>${d.name}</b><br><small style="opacity:0.5; font-size:9px;">B:${d.pBig||0}/S:${d.pSmall||0}/M:${d.pMini||0}</small></div><div class="del-x-btn" onclick="window.handleDeleteDrink('${d.id}')">${I18N[currentLang].remove}</div>`; 
                list.appendChild(el); 
            }); 
        };  
        
        window.toggleManage = (s) => document.getElementById('managePage').classList.toggle('show', s);  
        window.handleDeleteDrink = (id) => window.showPop(I18N[currentLang].confirm_del, () => deleteDoc(doc(db, 'drinks', id)));  
        window.showToast = (m) => { const t = document.getElementById('toast'); document.getElementById('toastMsg').innerText = m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); };
        
        window.showPop = (m, callback, isSuccess = false, isWarning = false) => { 
            const ov = document.getElementById('modalOverlay'); const msg = document.getElementById('modalMsg'); const btns = document.getElementById('modalBtns'); const iconArea = document.getElementById('modalIconArea'); const warnSlot = document.getElementById('warnIconSlot');
            ov.style.display = 'flex'; btns.innerHTML = ""; iconArea.innerHTML = ""; warnSlot.innerHTML = "";
            document.body.classList.add('modal-open');
        
            if(isSuccess) {
                iconArea.innerHTML = `<svg style="width:70px;height:70px;" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="var(--success)" stroke-width="5"/><path d="M30 50 L45 65 L70 35" fill="none" stroke="var(--success)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:100; stroke-dashoffset:100; animation: drawCheck 0.6s ease-in-out forwards;"/></svg><style>@keyframes drawCheck{to{stroke-dashoffset:0}}</style>`;
                msg.innerText = m;
            } else if(isWarning) {
                // ⚠️ 修正：图标文字严格同行
                warnSlot.innerHTML = `<svg viewBox="0 0 100 100" style="width:22px;height:22px;fill:var(--warning);display:block;"><path d="M50 15 L90 85 L10 85 Z" fill="none" stroke="var(--warning)" stroke-width="8" stroke-linejoin="round"/><rect x="46" y="42" width="8" height="22" fill="var(--warning)" rx="2"/><circle cx="50" cy="74" r="4" fill="var(--warning)"/></svg>`;
                msg.innerText = m;
            } else { msg.innerText = m; }
        
            if(callback) {
                btns.innerHTML = `<button class="m-btn m-btn-gray" id="pCancel">${I18N[currentLang].cancel}</button><button class="m-btn m-btn-black" id="pOk">${I18N[currentLang].confirm}</button>`;
                document.getElementById('pCancel').onclick = () => { ov.style.display='none'; document.body.classList.remove('modal-open'); };
                document.getElementById('pOk').onclick = () => { callback(); ov.style.display='none'; document.body.classList.remove('modal-open'); };
            } else {
                btns.innerHTML = `<button class="m-btn m-btn-black" style="width:100%" id="pOk">${I18N[currentLang].btn_ok}</button>`;
                document.getElementById('pOk').onclick = () => { ov.style.display='none'; document.body.classList.remove('modal-open'); };
            }
        };
        
        const compressImage = (file) => { return new Promise((resolve) => { const reader = new FileReader(); reader.readAsDataURL(file); reader.onload = (e) => { const img = new Image(); img.src = e.target.result; img.onload = () => { const canvas = document.createElement('canvas'); const MAX_WIDTH = 400; let width = img.width, height = img.height; if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; } canvas.width = width; canvas.height = height; const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height); resolve(canvas.toVDataURL('image/jpeg', 0.7)); }; }; }); };
        window.addDrink = async () => { 
            const n = document.getElementById('addName').value, pb = document.getElementById('pBig').value, ps = document.getElementById('pSmall').value, pm = document.getElementById('pMini').value;
            if(!n) return; const addBtn = document.getElementById('addBtn'); addBtn.innerText = "WAIT..."; addBtn.disabled = true;
            try { await addDoc(collection(db, "drinks"), { name: n, pBig: parseFloat(pb)||0, pSmall: parseFloat(ps)||0, pMini: parseFloat(pm)||0, img: base64, createdAt: serverTimestamp() }); document.getElementById('addName').value = ''; document.getElementById('pBig').value = ''; document.getElementById('pSmall').value = ''; document.getElementById('pMini').value = ''; base64 = ""; document.getElementById('fileLabel').innerText = I18N[currentLang].select_file; window.showPop(I18N[currentLang].add_success, null, true); } catch (e) { alert("Error!"); } finally { addBtn.innerText = I18N[currentLang].sync; addBtn.disabled = false; }
        };
        document.getElementById('fileInp').onchange = async (e) => { if(e.target.files[0]) { base64 = await compressImage(e.target.files[0]); document.getElementById('fileLabel').innerText = "READY ✅"; } };  
        init();
    </script>
