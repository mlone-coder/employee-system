<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>EMPLOYEE-SYSTEM</title>

    <style>
        *{
          margin:0;
          padding:0;
          box-sizing:border-box;
          font-family:Arial,sans-serif;
        
          -webkit-tap-highlight-color: transparent;
        }
        
        body{
          background:#f4f4f4;
          color:#111;
        
          padding-bottom:90px;
        
          user-select:none;
          touch-action:manipulation;
        }
        
        /* TOP */
        
        .topbar{
          padding:22px;
          font-size:24px;
          font-weight:bold;
        }
        
        /* PAGE */
        
        .page{
          display:none;
        }
        
        .page.active{
          display:block;
        }
        
        /* CARD */
        
        .card{
          background:white;
        
          margin:15px;
          padding:18px;
        
          border-radius:28px;
        
          box-shadow:0 5px 18px rgba(0,0,0,0.08);
        }
        
        /* TABLE */
        
        .table-row{
          display:flex;
          align-items:center;
          gap:14px;
        }
        
        .table-icon{
        
          width:58px;
          height:58px;
        
          border-radius:18px;
        
          background:#111;
        
          display:flex;
          align-items:center;
          justify-content:center;
        }
        
        .table-logo{
          position:relative;
          width:32px;
          height:32px;
        }
        
        .table-top{
          width:32px;
          height:14px;
          background:white;
          border-radius:6px;
        }
        
        .table-leg{
          position:absolute;
          width:4px;
          height:14px;
          background:white;
          bottom:0;
        }
        
        .left{
          left:6px;
        }
        
        .right{
          right:6px;
        }
        
        .table-info{
          flex:1;
        }
        
        .table-title{
          font-size:20px;
          font-weight:bold;
        }
        
        .table-input{
          width:100%;
        
          margin-top:8px;
        
          padding:12px;
        
          border:none;
          border-radius:16px;
        
          background:#f5f5f5;
        
          font-size:16px;
        }
        
        /* ORDER */
        
        .order-title{
          font-size:20px;
          font-weight:bold;
          margin-bottom:14px;
        }
        
        .order-item{
          display:flex;
          justify-content:space-between;
          align-items:center;
        
          background:#f8f8f8;
        
          padding:14px;
        
          border-radius:18px;
        
          margin-bottom:12px;
        }
        
        .order-left{
          display:flex;
          flex-direction:column;
        }
        
        .qty-controls{
          display:flex;
          align-items:center;
          gap:10px;
        }
        
        .qty-btn{
        
          width:34px;
          height:34px;
        
          border:none;
          border-radius:12px;
        
          background:#111;
          color:white;
        
          font-size:18px;
        
          transition:0.05s;
        }
        
        .qty-btn:active{
          transform:scale(0.9);
        }
        
        .submit-btn{
        
          width:100%;
        
          padding:16px;
        
          border:none;
          border-radius:18px;
        
          background:#111;
          color:white;
        
          font-size:17px;
        
          margin-top:14px;
        }
        
        .clear-row{
          display:flex;
          justify-content:flex-end;
        }
        
        .clear-btn{
        
          padding:10px 14px;
        
          border:none;
          border-radius:14px;
        
          background:#d70000;
          color:white;
        
          font-size:14px;
        
          margin-top:10px;
        
          transition:0.05s;
        }
        
        .clear-btn:active{
          transform:scale(0.92);
        }
        
        /* MENU */
        
        .menu-section{
          margin:15px;
        }
        
        .menu-title{
          font-size:20px;
          font-weight:bold;
          margin-bottom:14px;
        }
        
        .menu-grid{
          display:grid;
          grid-template-columns:1fr 1fr;
          gap:12px;
        }
        
        .menu-item{
        
          background:white;
        
          border-radius:24px;
        
          padding:18px;
        
          box-shadow:0 5px 15px rgba(0,0,0,0.08);
        
          transition:0.05s;
        }
        
        .menu-item:active{
          transform:scale(0.94);
        }
        
        .drink-name{
          font-size:18px;
          font-weight:bold;
        }
        
        .drink-price{
          margin-top:6px;
          color:gray;
        }
        
        /* SETTINGS */
        
        .setting-box{
          background:#f8f8f8;
          padding:16px;
          border-radius:18px;
          margin-bottom:12px;
        }
        
        /* NAVBAR */
        
        .navbar{
        
          position:fixed;
          bottom:0;
          left:0;
        
          width:100%;
          height:78px;
        
          background:white;
        
          display:flex;
          justify-content:space-around;
          align-items:center;
        
          box-shadow:0 -5px 15px rgba(0,0,0,0.08);
        }
        
        .nav-item{
        
          display:flex;
          flex-direction:column;
          align-items:center;
        
          font-size:12px;
        
          position:relative;
        }
        
        .nav-icon-box{
        
          width:52px;
          height:40px;
        
          border-radius:16px;
        
          display:flex;
          align-items:center;
          justify-content:center;
        
          margin-bottom:4px;
        }
        
        .nav-item.active .nav-icon-box{
          background:#111;
        }
        
        .nav-item.active svg{
          fill:white;
        }
        
        svg{
          width:22px;
          height:22px;
          fill:#111;
        }
        
        /* EMPTY */
        
        .empty{
          color:gray;
          text-align:center;
          padding:20px;
        }
        
    </style>
</head>

<body>

    <div class="topbar">
        EMPLOYEE-SYSTEM
    </div>

    <!-- HOME -->

    <div id="homePage" class="page active">

        <div class="card">

            <div class="table-row">

                <div class="table-icon">

                    <div class="table-logo">

                        <div class="table-top"></div>

                        <div class="table-leg left"></div>

                        <div class="table-leg right"></div>

                    </div>

                </div>

                <div class="table-info">

                    <div class="table-title">
                        Table Number
                    </div>

                    <input id="tableInput" class="table-input" placeholder="Enter table number">

                </div>

            </div>

        </div>

        <div class="card">

            <div class="order-title">
                Current Order
            </div>

            <div id="orderList"></div>

            <button class="submit-btn" onclick="submitOrder()">
                Submit Order
            </button>

            <div class="clear-row">

                <button class="clear-btn" onclick="clearCart()">
                    Clear
                </button>

            </div>

        </div>

        <div class="menu-section">

            <div class="menu-title">
                Drinks Menu
            </div>

            <div class="menu-grid">

                <div class="menu-item" onclick="addDrink('Coke')">

                    <div class="drink-name">
                        🥤 Coke
                    </div>

                    <div class="drink-price">
                        RM 5
                    </div>

                </div>

                <div class="menu-item" onclick="addDrink('Sprite')">

                    <div class="drink-name">
                        🍋 Sprite
                    </div>

                    <div class="drink-price">
                        RM 5
                    </div>

                </div>

                <div class="menu-item" onclick="addDrink('Coffee')">

                    <div class="drink-name">
                        ☕ Coffee
                    </div>

                    <div class="drink-price">
                        RM 8
                    </div>

                </div>

                <div class="menu-item" onclick="addDrink('Tea')">

                    <div class="drink-name">
                        🫖 Tea
                    </div>

                    <div class="drink-price">
                        RM 6
                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- CART -->

    <div id="cartPage" class="page">

        <div class="card">

            <div class="order-title">
                Shopping Cart
            </div>

            <div id="cartContent"></div>

        </div>

    </div>

    <!-- SETTINGS -->

    <div id="settingsPage" class="page">

        <div class="card">

            <div class="order-title">
                Settings
            </div>

            <div class="setting-box">
                🔔 Notifications Enabled
            </div>

            <div class="setting-box">
                ☁️ Firebase Connected
            </div>

            <div class="setting-box">
                📱 Mobile Optimized
            </div>

        </div>

    </div>

    <!-- NAVBAR -->

    <div class="navbar">

        <div class="nav-item active" onclick="showPage('homePage', this)">

            <div class="nav-icon-box">

                <svg viewBox="0 0 24 24">
                    <path d="M12 3L3 10V21H9V15H15V21H21V10L12 3Z" />
                </svg>

            </div>

            Home

        </div>

        <div class="nav-item" onclick="showPage('cartPage', this)">

            <div class="nav-icon-box">

                <svg viewBox="0 0 24 24">
                    <path d="M7 4H3V6H5L8.6 13.59L7.25 16.04C7.09 16.32 7 16.65 7 17A2 2 0 0 0 9 19H21V17H9.42A0.25 0.25 0 0 1 9.2 16.63L10.1 15H17.55C18.3 15 18.96 14.59 19.3 13.97L22.88 7.48A1 1 0 0 0 22 6H8.21L7.27 4Z" />
                </svg>

            </div>

            Cart

        </div>

        <div class="nav-item" onclick="showPage('settingsPage', this)">

            <div class="nav-icon-box">

                <svg viewBox="0 0 24 24">
                    <path d="M19.14 12.94A7.49 7.49 0 0 0 19.19 12A7.49 7.49 0 0 0 19.14 11.06L21.19 9.47A0.5 0.5 0 0 0 21.31 8.84L19.31 5.16A0.5 0.5 0 0 0 18.7 4.97L16.29 5.96A7.28 7.28 0 0 0 14.68 5.03L14.32 2.5A0.5 0.5 0 0 0 13.82 2H10.18A0.5 0.5 0 0 0 9.68 2.5L9.32 5.03A7.28 7.28 0 0 0 7.71 5.96L5.3 4.97A0.5 0.5 0 0 0 4.69 5.16L2.69 8.84A0.5 0.5 0 0 0 2.81 9.47L4.86 11.06A7.49 7.49 0 0 0 4.81 12A7.49 7.49 0 0 0 4.86 12.94L2.81 14.53A0.5 0.5 0 0 0 2.69 15.16L4.69 18.84A0.5 0.5 0 0 0 5.3 19.03L7.71 18.04A7.28 7.28 0 0 0 9.32 18.97L9.68 21.5A0.5 0.5 0 0 0 10.18 22H13.82A0.5 0.5 0 0 0 14.32 21.5L14.68 18.97A7.28 7.28 0 0 0 16.29 18.04L18.7 19.03A0.5 0.5 0 0 0 19.31 18.84L21.31 15.16A0.5 0.5 0 0 0 21.19 14.53L19.14 12.94ZM12 15.5A3.5 3.5 0 1 1 12 8.5A3.5 3.5 0 0 1 12 15.5Z" />
                </svg>

            </div>

            Settings

        </div>

    </div>

    <script type="module">
        import { initializeApp }
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        
        import {
          getFirestore,
          collection,
          addDoc
        }
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        
        /* FIREBASE */
        
        const firebaseConfig = {
        
          apiKey: "AIzaSyBNk0S-ArNKrK_fmUZJb6K2U2252rT5FNU",
        
          authDomain: "restaurant-app-bc3c1.firebaseapp.com",
        
          projectId: "restaurant-app-bc3c1",
        
          storageBucket: "restaurant-app-bc3c1.firebasestorage.app",
        
          messagingSenderId: "25868708085",
        
          appId: "1:25868708085:web:5585774b7ede6ecd127dbc"
        
        };
        
        const app = initializeApp(firebaseConfig);
        
        const db = getFirestore(app);
        
        /* ORDER DATA */
        
        let orders = {};
        
        /* ADD */
        
        window.addDrink = function(name){
        
          if(!orders[name]){
            orders[name] = 1;
          }else{
            orders[name]++;
          }
        
          renderOrders();
        };
        
        /* CHANGE */
        
        window.changeQty = function(name, amount){
        
          orders[name] += amount;
        
          if(orders[name] <= 0){
            delete orders[name];
          }
        
          renderOrders();
        };
        
        /* RENDER */
        
        function renderOrders(){
        
          const orderList =
          document.getElementById("orderList");
        
          const cartContent =
          document.getElementById("cartContent");
        
          orderList.innerHTML = "";
          cartContent.innerHTML = "";
        
          if(Object.keys(orders).length === 0){
        
            orderList.innerHTML =
            `<div class="empty">No items yet</div>`;
        
            cartContent.innerHTML =
            `<div class="empty">Cart is empty</div>`;
        
            return;
          }
        
          for(let item in orders){
        
            const html = `
        
              <div class="order-item">
        
                <div class="order-left">
                  <strong>${item}</strong>
                  <span>Drink Item</span>
                </div>
        
                <div class="qty-controls">
        
                  <button class="qty-btn"
                  onclick="changeQty('${item}', -1)">
                    -
                  </button>
        
                  <span>${orders[item]}</span>
        
                  <button class="qty-btn"
                  onclick="changeQty('${item}', 1)">
                    +
                  </button>
        
                </div>
        
              </div>
        
            `;
        
            orderList.innerHTML += html;
            cartContent.innerHTML += html;
          }
        }
        
        /* CLEAR */
        
        window.clearCart = function(){
        
          orders = {};
        
          renderOrders();
        
        };
        
        /* SUBMIT */
        
        window.submitOrder = async function(){
        
          const table =
          document.getElementById("tableInput").value;
        
          if(!table){
        
            alert("Enter table number!");
        
            return;
          }
        
          if(Object.keys(orders).length === 0){
        
            alert("No items selected!");
        
            return;
          }
        
          try{
        
            await addDoc(
              collection(db, "orders"),
              {
        
                table: table,
        
                items: orders,
        
                createdAt: Date.now()
        
              }
            );
        
            alert("✅ Order Submitted!");
        
            orders = {};
        
            renderOrders();
        
          }catch(error){
        
            console.log(error);
        
            alert("❌ Firebase Error");
          }
        
        };
        
        /* PAGE */
        
        window.showPage = function(pageId, element){
        
          document.querySelectorAll(".page")
          .forEach(page=>{
        
            page.classList.remove("active");
        
          });
        
          document
          .getElementById(pageId)
          .classList.add("active");
        
          document.querySelectorAll(".nav-item")
          .forEach(nav=>{
        
            nav.classList.remove("active");
        
          });
        
          element.classList.add("active");
        };
        
        renderOrders();
        
    </script>

</body>

</html>
